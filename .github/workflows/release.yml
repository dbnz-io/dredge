name: CI / Release

# Single pipeline, split by domain so a red check tells you exactly what broke:
#
#   test  ─┐
#   security ─┼─►  release   (only on push to main; auto-bumps the patch version)
#   package ─┘
#
# test / security / package run on every PR and push. release waits for all
# three to pass (needs:), then, ONLY on a push to main, auto-increments the
# PATCH version: it writes the new version into pyproject.toml + README.md and
# commits that back to main ("[skip ci]" so the bump push doesn't re-trigger)
# BEFORE building and publishing. Contributors no longer hand-edit the version;
# pyproject's version on main always equals the last published release, and each
# real merge publishes (last patch + 1). The bump is keyed off the version at
# the triggering commit and guarded on the target tag, so manual re-runs are
# idempotent (a re-run after success finds the tag already present and no-ops).
#
# PREREQUISITE: the release job pushes the bump commit to main with the default
# GITHUB_TOKEN. If main is protected, allow github-actions[bot] to bypass the
# push restriction (or the push — and the release — will fail).
#
# NOTE: this file is intentionally named release.yml (not ci.yml). The PyPI
# Trusted Publisher is bound to the workflow *filename* release.yml -- renaming
# it would break OIDC publishing until the publisher is reconfigured to match.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # Supersede in-progress PR runs, but never cancel a main run mid-release.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ---- domain: tests ----
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor (requires-python = ">=3.10"; google-cloud-logging's
        # dependency chain dropped 3.9). 3.13 matches the Dockerfile. 3.11/3.12
        # are covered because the package classifiers claim them.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (with test extra)
        run: pip install -e ".[test]"
      - name: Run tests with coverage
        run: pytest --cov=dredge --cov-report=term-missing --cov-fail-under=80 -q

  # ---- domain: static security ----
  security:
    name: Security (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install bandit
        run: pip install bandit
      # Scan the library only (not tests). Known false positives are annotated
      # inline with `# nosec <id>`, so any *new* finding fails.
      - name: Run bandit
        run: bandit -r dredge -q

  # ---- domain: packaging ----
  package:
    name: Package (build + validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
      - name: Validate distribution metadata (twine check)
        run: python -m twine check dist/*
      - name: Clean-install smoke test (wheel imports + console script runs)
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python -c "import dredge; from dredge import Dredge"
          /tmp/smoke/bin/dredge --help >/dev/null
      # Hand the validated artifacts to the release job so it publishes exactly
      # what was built and tested here (build once, publish the same bytes).
      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ---- domain: release (publish) ----
  release:
    name: Release (PyPI + SBOM + GitHub Release)
    needs: [test, security, package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Ties the PyPI publish to a GitHub Environment named "pypi" (match this in
    # the PyPI pending/trusted publisher). Add required reviewers to gate here.
    environment: pypi
    permissions:
      contents: write # create the tag + release
      id-token: write # PyPI Trusted Publishing (OIDC) -- no stored token
    concurrency:
      # Never let two releases overlap, and never cancel one mid-publish.
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # need tags to know whether this version was released
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      # The version at the *triggering* commit is the stable input: computing
      # next = patch + 1 from it (rather than from main's moving tip) keeps
      # manual re-runs deterministic. Contributors don't hand-bump anymore, so
      # this equals the last published release.
      - name: Compute next patch version
        id: ver
        run: |
          base=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          next=$(python - "$base" <<'PY'
          import sys
          major, minor, patch = (int(x) for x in sys.argv[1].split("."))
          print(f"{major}.{minor}.{patch + 1}")
          PY
          )
          echo "base=$base"    >> "$GITHUB_OUTPUT"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next"    >> "$GITHUB_OUTPUT"
          echo "::notice::Auto patch bump $base -> $next"

      - name: Has this version already been released?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --quiet origin
          if git rev-parse "refs/tags/${{ steps.ver.outputs.tag }}" >/dev/null 2>&1 \
            || gh release view "${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ steps.ver.outputs.tag }} already exists — nothing to release."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      # ---- everything below only runs when the version is new ----

      # Write the new version into pyproject.toml + README.md and commit it to
      # main BEFORE building/publishing, so the published artifact and the repo
      # agree. Work against origin/main's tip so the push fast-forwards; a prior
      # partial run that already bumped it produces no diff (no-op commit). The
      # "[skip ci]" tag stops this push from re-triggering the pipeline.
      - name: Bump version on main
        id: bump
        if: steps.check.outputs.release == 'true'
        run: |
          next="${{ steps.ver.outputs.version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          sed -i -E 's/^version = "[0-9]+\.[0-9]+\.[0-9]+"/version = "'"$next"'"/' pyproject.toml
          sed -i -E "s/Dredge - [0-9]+\.[0-9]+\.[0-9]+/Dredge - $next/" README.md
          if [ -n "$(git status --porcelain)" ]; then
            git commit -am "chore(release): v$next [skip ci]"
            git push origin main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Rebuild from the bumped tree: the package job's artifact carries the
      # pre-bump version, so it can't be the thing we publish. That job stays as
      # the per-PR build/validate gate; this is the authoritative build.
      - name: Build the bumped distribution
        if: steps.check.outputs.release == 'true'
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      # Publish to PyPI BEFORE the GitHub Release: the Release step creates the
      # tag the idempotency guard keys on, so keeping it last makes a transient
      # failure retryable. skip-existing keeps re-runs from failing on an
      # already-uploaded (immutable) version. dist/ holds only wheel + sdist;
      # the SBOM is generated afterwards, into the repo root, so it never goes
      # to PyPI.
      - name: Publish to PyPI (Trusted Publishing)
        if: steps.check.outputs.release == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true

      - name: Generate CycloneDX SBOM (runtime dependency tree)
        if: steps.check.outputs.release == 'true'
        run: |
          python -m pip install cyclonedx-bom
          # Resolve dredge + its *runtime* deps into a clean venv so the SBOM
          # reflects what an installed user gets, not the CI/test toolchain.
          python -m venv /tmp/sbomenv
          /tmp/sbomenv/bin/pip install --upgrade pip
          /tmp/sbomenv/bin/pip install .
          python -m cyclonedx_py environment \
            --of JSON \
            --pyproject pyproject.toml \
            -o "dredge-ir-${{ steps.ver.outputs.version }}-sbom.cdx.json" \
            /tmp/sbomenv/bin/python

      - name: Create GitHub Release
        if: steps.check.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            --target "${{ steps.bump.outputs.sha }}" \
            --title "dredge ${{ steps.ver.outputs.version }}" \
            --generate-notes \
            dist/* "dredge-ir-${{ steps.ver.outputs.version }}-sbom.cdx.json"
