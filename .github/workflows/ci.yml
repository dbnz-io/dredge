name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    # No AWS/GitHub/GCP credentials needed -- every test mocks the
    # respective client entirely (see CLAUDE.md: "no real cloud
    # credentials are needed").
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor pyproject.toml claims (requires-python = ">=3.10"
        # -- was ">=3.9" until this workflow's first real run proved that
        # false: google-cloud-logging's own dependency chain dropped 3.9
        # support, and pip on 3.9 backtracks for 40+ minutes before failing
        # with resolution-too-deep trying to find a version set that no
        # longer exists). 3.13 matches the Dockerfile's real deploy target.
        # 3.11/3.12 are covered too since the package classifiers claim them.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[test]"

      - name: Run tests with coverage
        run: pytest --cov=dredge --cov-report=term-missing --cov-fail-under=80 -q

  security:
    name: Security scan (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install bandit
        run: pip install bandit

      # Scan the library only (not tests). Known false positives are annotated
      # inline with `# nosec <id>` + justification, so any *new* finding fails.
      - name: Run bandit
        run: bandit -r dredge -q
